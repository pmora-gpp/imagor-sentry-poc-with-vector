# imagor 422s (e.g. maximum resolution exceeded) are sent over UDP syslog to the
# imagor-sentry-forwarder sidecar; dropped harmlessly if it isn't listening
map $status $is_422 {
  422     1;
  default 0;
}
log_format imagor_422 escape=json
  '{"time":"$time_iso8601","host":"$host","uri":"$request_uri",'
  '"referer":"$http_referer","ua":"$http_user_agent"}';
server {
    listen 80 default_server;
    server_name img-dev.globalcitizen.org;
    root /opt;
    charset utf-8;
    server_tokens off;
    access_log /var/log/nginx/access.log main;
    access_log syslog:server=127.0.0.1:5140,tag=imagor422,nohostname imagor_422 if=$is_422;
    add_header Strict-Transport-Security "max-age=2592000" always; # 30 days
    add_header Referrer-Policy           "strict-origin-when-cross-origin"             always;
    location ~ ^/healthcheck$ {
      proxy_redirect off;
      proxy_pass http://app_upstream;
    }
    location / {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Host $host;
      proxy_redirect off;
      proxy_pass http://app_upstream;
    }
}
upstream app_upstream {
  server 127.0.0.1:8000;
}
